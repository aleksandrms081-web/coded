name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build PerkLock engine
        run: npm run build:perklock
      - name: Test PerkLock engine
        run: npm test
      - name: Build server
        run: npm run build --workspace @perk-wallet/server
      - name: Build frontend
        run: npm run build --workspace @perk-wallet/frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f server/Dockerfile -t perk-wallet-api .
          docker build -f frontend/Dockerfile --build-arg VITE_API_BASE_URL=http://localhost:8080 -t perk-wallet-web .
