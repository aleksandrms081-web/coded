<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-label="Perk Wallet preview">
  <defs>
    <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="a1" cx="18%" cy="22%" r="55%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="85%" cy="18%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="72%" cy="88%" r="55%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="460" rx="22" fill="#0b0a1a"/>
  <rect width="820" height="460" rx="22" fill="url(#a1)"/>
  <rect width="820" height="460" rx="22" fill="url(#a2)"/>
  <rect width="820" height="460" rx="22" fill="url(#a3)"/>
  <rect x="1" y="1" width="818" height="458" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- wordmark -->
  <text x="60" y="150" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#hGrad)">Perk Wallet</text>
  <text x="62" y="192" font-family="Inter, system-ui, sans-serif" font-size="21" fill="#9a96b8">Self-hostable web3 wallet with time-locked vaults</text>
  <!-- pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e9e7f5">
    <rect x="60" y="224" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="80" y="246">Non-custodial</text>
    <rect x="222" y="224" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="242" y="246">SIWE auth</text>
    <rect x="366" y="224" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="386" y="246">PerkLock</text>
  </g>
  <!-- glass card with countdown ring -->
  <g transform="translate(556,150)">
    <rect x="0" y="0" width="204" height="170" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="102" cy="74" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10"/>
    <circle cx="102" cy="74" r="46" fill="none" stroke="url(#hGrad)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="289" stroke-dashoffset="96" transform="rotate(-90 102 74)"/>
    <text x="102" y="70" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9a96b8">unlocks in</text>
    <text x="102" y="92" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="700" fill="#e9e7f5">29d 14h</text>
    <text x="102" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9a96b8">Vault · sealed</text>
  </g>
</svg>
