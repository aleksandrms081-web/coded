# Perk Wallet — full platform stack (frontend + API + Cloudflare Tunnel).
# Bring everything up with:  docker compose up -d --build
#
# Architecture:
#   user → Cloudflare edge (HTTPS, free cert)
#        → cloudflared (outbound-only tunnel from this VPS)
#        → web (nginx, SPA + /api proxy) → api (Express)
#
# No inbound ports needed on the host. nginx in `web` proxies /api/* to `api`,
# so Cloudflare Tunnel only needs a single public hostname pointing to
# http://web:80.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET}
      - SIWE_DOMAIN=${SIWE_DOMAIN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PERKLOCK_DRAND_NETWORK=${PERKLOCK_DRAND_NETWORK:-mainnet}
    volumes:
      - perk-data:/data
    restart: unless-stopped
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_DEFAULT_CHAIN_ID=${VITE_DEFAULT_CHAIN_ID:-1}
        - VITE_RPC_URL=${VITE_RPC_URL}
        - VITE_APP_NAME=${VITE_APP_NAME:-Perk Wallet}
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "80"

  # Cloudflare Tunnel — outbound-only connection from the VPS to Cloudflare's
  # edge. Routing is configured in the Cloudflare dashboard under the tunnel's
  # "Public Hostnames" tab: point lesmes.bitmax.eu.cc → http://web:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  perk-data:
